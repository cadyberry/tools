<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV ↔ JSON</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 20px 32px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; }
  header a { color: #888; text-decoration: none; font-size: 14px; }
  header a:hover { color: #fff; }
  header span { color: #444; }
  h1 { font-size: 18px; font-weight: 600; }
  .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .pane { display: flex; flex-direction: column; }
  .pane + .pane { border-left: 1px solid #222; }
  .pane-header { padding: 12px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #141414; }
  .pane-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  textarea, .output { flex: 1; padding: 20px; font-family: 'Menlo', 'Monaco', monospace; font-size: 13px; line-height: 1.6; background: #0f0f0f; border: none; outline: none; resize: none; color: #e0e0e0; min-height: 400px; }
  .output { white-space: pre; overflow: auto; }
  .output.error { color: #ff6b6b; }
  .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #ccc; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: #2a2a2a; color: #fff; border-color: #555; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .controls { padding: 12px 20px; border-top: 1px solid #222; display: flex; gap: 8px; align-items: center; background: #141414; }
  .status { font-size: 12px; color: #888; margin-left: auto; }
  .mode-toggle { display: flex; gap: 4px; }
  .sep { color: #444; font-size: 12px; margin: 0 4px; }
  select { background: #1e1e1e; border: 1px solid #333; color: #ccc; padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <a href="../">← Tools</a>
  <span>/</span>
  <h1>CSV ↔ JSON Converter</h1>
</header>
<div class="main">
  <div class="pane">
    <div class="pane-header">
      <span class="pane-label">Input</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <span style="font-size:12px;color:#666;">delimiter</span>
        <select id="delimiter">
          <option value=",">comma</option>
          <option value="	">tab</option>
          <option value=";">semicolon</option>
          <option value="|">pipe</option>
        </select>
      </div>
    </div>
    <textarea id="input" placeholder="Paste CSV or JSON here..." oninput="autoConvert()"></textarea>
    <div class="controls">
      <div class="mode-toggle">
        <button class="btn active" id="btn-csv" onclick="setMode('csv')">CSV → JSON</button>
        <button class="btn" id="btn-json" onclick="setMode('json')">JSON → CSV</button>
      </div>
      <button class="btn primary" onclick="convert()">Convert</button>
    </div>
  </div>
  <div class="pane">
    <div class="pane-header">
      <span class="pane-label">Output</span>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="downloadOutput()">Download</button>
        <button class="btn" onclick="copyOutput()">Copy</button>
      </div>
    </div>
    <div class="output" id="output">Output will appear here.</div>
    <div class="controls">
      <span class="status" id="status">ready</span>
    </div>
  </div>
</div>
<script>
  let mode = 'csv';

  function setMode(m) {
    mode = m;
    document.getElementById('btn-csv').className = 'btn' + (m === 'csv' ? ' active' : '');
    document.getElementById('btn-json').className = 'btn' + (m === 'json' ? ' active' : '');
    convert();
  }

  function autoConvert() {
    const val = document.getElementById('input').value.trim();
    if (!val) { document.getElementById('output').textContent = ''; setStatus('ready'); return; }
    // Auto-detect mode
    if (val.startsWith('{') || val.startsWith('[')) {
      if (mode !== 'json') setMode('json');
      else convert();
    } else {
      if (mode !== 'csv') setMode('csv');
      else convert();
    }
  }

  function convert() {
    const val = document.getElementById('input').value.trim();
    const output = document.getElementById('output');
    if (!val) { output.textContent = ''; setStatus('ready'); return; }
    try {
      if (mode === 'csv') {
        output.textContent = JSON.stringify(csvToJson(val), null, 2);
        output.className = 'output';
      } else {
        output.textContent = jsonToCsv(JSON.parse(val));
        output.className = 'output';
      }
      setStatus('converted');
    } catch(e) {
      output.textContent = e.message;
      output.className = 'output error';
      setStatus('error');
    }
  }

  function getDelimiter() {
    return document.getElementById('delimiter').value;
  }

  function csvToJson(csv) {
    const d = getDelimiter();
    const lines = csv.split('\n').filter(l => l.trim());
    const headers = parseCSVLine(lines[0], d);
    return lines.slice(1).map(line => {
      const vals = parseCSVLine(line, d);
      const obj = {};
      headers.forEach((h, i) => obj[h.trim()] = vals[i] !== undefined ? vals[i].trim() : '');
      return obj;
    });
  }

  function parseCSVLine(line, delimiter) {
    const result = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQuote = !inQuote; }
      else if (line[i] === delimiter && !inQuote) { result.push(cur); cur = ''; }
      else { cur += line[i]; }
    }
    result.push(cur);
    return result;
  }

  function jsonToCsv(data) {
    const d = getDelimiter();
    const arr = Array.isArray(data) ? data : [data];
    if (!arr.length) return '';
    const headers = Object.keys(arr[0]);
    const rows = arr.map(row => headers.map(h => {
      const v = String(row[h] ?? '');
      return v.includes(d) || v.includes('"') || v.includes('\n') ? `"${v.replace(/"/g, '""')}"` : v;
    }).join(d));
    return [headers.join(d), ...rows].join('\n');
  }

  function setStatus(msg) { document.getElementById('status').textContent = msg; }

  function copyOutput() {
    navigator.clipboard.writeText(document.getElementById('output').textContent);
    event.target.textContent = 'Copied!';
    setTimeout(() => event.target.textContent = 'Copy', 1500);
  }

  function downloadOutput() {
    const text = document.getElementById('output').textContent;
    const ext = mode === 'csv' ? 'json' : 'csv';
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `converted.${ext}`;
    a.click();
  }
</script>
</body>
</html>
